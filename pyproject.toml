# uv manages the Python command bridge's dependencies. setup.py stays the ROS 2 (colcon) build,
# so uv never builds or installs this package. pytest reads its settings from setup.cfg.
[project]
name = "touch-vision-drone-control"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.3",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-aiohttp==1.1.1",
]

[tool.uv]
package = false
