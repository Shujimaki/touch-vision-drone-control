# crazyflies.yaml - Thesis multi-drone configuration
robots:
  cf1:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E7EC
    initial_position: [0.0, 0.0, 0.0]
    type: cf21
  cf2:
    enabled: false
    uri: radio://0/80/2M/E7E7E7E702
    initial_position: [0.3, 0.0, 0.0]
    type: cf21
  cf3:
    enabled: false
    uri: radio://0/80/2M/E7E7E7E703
    initial_position: [-0.3, 0.0, 0.0]
    type: cf21

robot_types:
  cf21:
    motion_capture:
      enabled: false
      marker: default
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.5
      voltage_critical: 3.2

all:
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10
      status:
        frequency: 1
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2
      controller: 1