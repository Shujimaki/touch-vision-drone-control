[project]
name = "touch-vision-bridge"
version = "0.1.0"
description = "Command bridge between the tablet web app and the flight host. This version streams motion-capture positions only."
readme = "README.md"
# ROS 2 Jazzy uses Python 3.12. motioncapture 1.1 publishes wheels up to Python 3.13.
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp==3.14.3",
    "motioncapture==1.1",
    "pydantic==2.13.5",
]

[project.scripts]
bridge = "bridge.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-aiohttp==1.1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bridge"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
